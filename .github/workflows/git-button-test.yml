name: Remove GIT test button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-git-button:
    if: "!contains(github.event.head_commit.message, '[skip git button]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove GIT button
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          line = '        <button id="gitTestBtn" class="dev-money-btn" type="button">GIT</button>\n'
          if line not in text:
              raise SystemExit(0)
          p.write_text(text.replace(line, ''), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove temporary GIT test button [skip git button]"
          git push
