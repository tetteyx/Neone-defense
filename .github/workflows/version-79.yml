name: Version 79

on:
  push:
    paths:
      - '.github/workflows/version-79.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Version 79
        shell: python
        run: |
          from pathlib import Path
          import re

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')

          old_css = '''.tower-card[data-tower="pulse"]{position:relative;overflow:hidden;border-color:rgba(99,230,255,.42);background:linear-gradient(135deg,rgba(8,31,48,.98),rgba(6,18,31,.98));box-shadow:inset 0 0 22px rgba(34,230,255,.055)}
.tower-card[data-tower="pulse"]:before{content:"";position:absolute;width:54px;height:54px;left:3px;top:50%;transform:translateY(-50%);border:1px solid rgba(99,230,255,.28);border-radius:50%;box-shadow:0 0 16px rgba(34,230,255,.18),inset 0 0 12px rgba(34,230,255,.08);pointer-events:none;animation:pulseTowerRing 2.8s linear infinite}
.tower-card[data-tower="pulse"] .tower-icon.pulse{color:#63e6ff;width:40px;height:40px;filter:drop-shadow(0 0 5px #63e6ff) drop-shadow(0 0 12px rgba(34,230,255,.75));transform:scale(1.08);position:relative;z-index:1}
.tower-card[data-tower="pulse"] .tower-icon.pulse .icon-bg{fill:#63e6ff;opacity:.14}
.tower-card[data-tower="pulse"] .tower-icon.pulse .icon-stroke{stroke-width:2.2}
.tower-card[data-tower="pulse"] .tower-icon.pulse .icon-fill{fill:#d9fbff;filter:drop-shadow(0 0 4px #63e6ff)}
.tower-card[data-tower="pulse"] .tower-copy b{color:#dffbff;text-shadow:0 0 9px rgba(99,230,255,.28)}
.tower-card[data-tower="pulse"].active{border-color:#63e6ff;background:linear-gradient(135deg,rgba(10,48,67,.98),rgba(5,22,36,.98));box-shadow:0 0 18px rgba(34,230,255,.16),inset 0 0 24px rgba(34,230,255,.08)}
@keyframes pulseTowerRing{0%{transform:translateY(-50%) scale(.9);opacity:.55}50%{transform:translateY(-50%) scale(1.05);opacity:.9}100%{transform:translateY(-50%) scale(.9);opacity:.55}}
'''
          new_css = '''/* Версия 79 — свечение Импульса только при выборе + единый стиль поставленных башен. */
.tower-card[data-tower="pulse"]{position:relative;overflow:hidden}
.tower-card[data-tower="pulse"] .tower-icon.pulse{position:relative;z-index:1}
.tower-card[data-tower="pulse"].active{border-color:#63e6ff;background:linear-gradient(135deg,rgba(10,48,67,.98),rgba(5,22,36,.98));box-shadow:0 0 18px rgba(34,230,255,.16),inset 0 0 24px rgba(34,230,255,.08)}
.tower-card[data-tower="pulse"].active .tower-icon.pulse{color:#63e6ff;width:40px;height:40px;filter:drop-shadow(0 0 5px #63e6ff) drop-shadow(0 0 12px rgba(34,230,255,.75));transform:scale(1.08)}
.tower-card[data-tower="pulse"].active .tower-icon.pulse .icon-bg{fill:#63e6ff;opacity:.14}
.tower-card[data-tower="pulse"].active .tower-icon.pulse .icon-stroke{stroke-width:2.2}
.tower-card[data-tower="pulse"].active .tower-icon.pulse .icon-fill{fill:#d9fbff;filter:drop-shadow(0 0 4px #63e6ff)}
.tower-card[data-tower="pulse"].active .tower-copy b{color:#dffbff;text-shadow:0 0 9px rgba(99,230,255,.28)}
'''
          if old_css not in css:
              raise SystemExit('Version 78 pulse CSS block not found')
          css = css.replace(old_css, new_css, 1)
          css += '''\n/* Версия 79 — визуальный стиль поставленных башен. */
.tower-placed-v79{filter:drop-shadow(0 0 8px currentColor)}
'''
          css_path.write_text(css, encoding='utf-8')

          game_path = Path('game-core.js')
          game = game_path.read_text(encoding='utf-8')

          start = game.index('function drawTower(tower) {')
          end = game.index('\n\n/* =========================================================\n   ВРАГИ', start)

          new_draw = r'''function drawTower(tower) {
  const type = towerTypes[tower.type];
  const selected = tower === state.selectedTower;
  const stats = getTowerStats(tower);

  if (selected && state.rangeUpgradeHover) {
    drawRangeUpgradePreview(tower, type);
  }

  drawTowerUpgradeVisual(tower, type);

  const comboReady = (state.comboReadyTowers && state.comboReadyTowers.has(tower)) || false;
  if (comboReady) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.15 * Math.sin(performance.now() / 180);
    ctx.strokeStyle = type.color;
    ctx.shadowBlur = 14;
    ctx.shadowColor = type.color;
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 6]);
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, 29, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();

  if (tower.speedOverdriveShake > 0) {
    const intensity = 6.5 * (tower.speedOverdriveShake / SPEED_OVERDRIVE_SHAKE_DURATION);
    ctx.translate((Math.random() - 0.5) * intensity, (Math.random() - 0.5) * intensity);
  }

  // Единый неоновый корпус: у каждой башни свой цвет и узнаваемый символ.
  // Сильное свечение и дополнительный внешний контур появляются только у выбранной башни.
  ctx.shadowBlur = selected ? 28 : 9;
  ctx.shadowColor = type.color;
  ctx.fillStyle = '#0d1826';
  ctx.strokeStyle = type.color;
  ctx.lineWidth = selected ? 3 : 2;

  // Внешний энергетический диск.
  ctx.globalAlpha = selected ? 1 : 0.92;
  ctx.beginPath();
  ctx.arc(tower.x, tower.y, 21, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Тонкое внутреннее кольцо.
  ctx.shadowBlur = selected ? 16 : 5;
  ctx.lineWidth = selected ? 2 : 1.5;
  ctx.strokeStyle = type.color;
  ctx.globalAlpha = selected ? 0.95 : 0.78;
  ctx.beginPath();
  ctx.arc(tower.x, tower.y, 12, 0, Math.PI * 2);
  ctx.stroke();

  // Центральное ядро.
  ctx.shadowBlur = selected ? 16 : 8;
  ctx.globalAlpha = 1;
  ctx.fillStyle = type.color;
  ctx.beginPath();
  ctx.arc(tower.x, tower.y, 5.5, 0, Math.PI * 2);
  ctx.fill();

  // Уникальный мотив каждой башни в том же визуальном языке, что и карточки.
  ctx.save();
  ctx.strokeStyle = type.color;
  ctx.fillStyle = type.color;
  ctx.lineWidth = selected ? 2.2 : 1.8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.shadowBlur = selected ? 12 : 5;

  if (tower.type === 'pulse') {
    ctx.beginPath();
    ctx.moveTo(tower.x, tower.y - 8);
    ctx.lineTo(tower.x, tower.y - 15);
    ctx.moveTo(tower.x, tower.y + 8);
    ctx.lineTo(tower.x, tower.y + 15);
    ctx.moveTo(tower.x - 8, tower.y);
    ctx.lineTo(tower.x - 15, tower.y);
    ctx.moveTo(tower.x + 8, tower.y);
    ctx.lineTo(tower.x + 15, tower.y);
    ctx.stroke();
  } else if (tower.type === 'rail') {
    ctx.beginPath();
    ctx.moveTo(tower.x - 9, tower.y + 9);
    ctx.lineTo(tower.x + 10, tower.y - 10);
    ctx.moveTo(tower.x - 4, tower.y + 14);
    ctx.lineTo(tower.x + 14, tower.y - 4);
    ctx.stroke();
  } else if (tower.type === 'frost') {
    ctx.beginPath();
    ctx.moveTo(tower.x, tower.y - 10);
    ctx.lineTo(tower.x, tower.y + 10);
    ctx.moveTo(tower.x - 10, tower.y);
    ctx.lineTo(tower.x + 10, tower.y);
    ctx.moveTo(tower.x - 7, tower.y - 7);
    ctx.lineTo(tower.x + 7, tower.y + 7);
    ctx.moveTo(tower.x + 7, tower.y - 7);
    ctx.lineTo(tower.x - 7, tower.y + 7);
    ctx.stroke();
  } else if (tower.type === 'blast') {
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      const r1 = 7;
      const r2 = 13;
      ctx.beginPath();
      ctx.moveTo(tower.x + Math.cos(a) * r1, tower.y + Math.sin(a) * r1);
      ctx.lineTo(tower.x + Math.cos(a) * r2, tower.y + Math.sin(a) * r2);
      ctx.stroke();
    }
  } else if (tower.type === 'arc') {
    ctx.beginPath();
    ctx.moveTo(tower.x - 10, tower.y + 6);
    ctx.quadraticCurveTo(tower.x, tower.y - 9, tower.x + 10, tower.y + 6);
    ctx.stroke();
  } else if (tower.type === 'titan') {
    ctx.beginPath();
    ctx.moveTo(tower.x - 10, tower.y - 8);
    ctx.lineTo(tower.x + 10, tower.y - 8);
    ctx.moveTo(tower.x - 10, tower.y + 8);
    ctx.lineTo(tower.x + 10, tower.y + 8);
    ctx.stroke();
  } else if (tower.type === 'nova') {
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(tower.x + Math.cos(a) * 8, tower.y + Math.sin(a) * 8);
      ctx.lineTo(tower.x + Math.cos(a) * 14, tower.y + Math.sin(a) * 14);
      ctx.stroke();
    }
  } else if (tower.type === 'devastator') {
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, 15, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tower.x - 9, tower.y - 9);
    ctx.lineTo(tower.x + 9, tower.y + 9);
    ctx.moveTo(tower.x + 9, tower.y - 9);
    ctx.lineTo(tower.x - 9, tower.y + 9);
    ctx.stroke();
  } else if (tower.type === 'singularity') {
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, 15, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, 8, 0, Math.PI * 2);
    ctx.stroke();
  } else if (tower.type === 'booster') {
    ctx.beginPath();
    ctx.moveTo(tower.x, tower.y - 14);
    ctx.lineTo(tower.x, tower.y + 14);
    ctx.moveTo(tower.x - 14, tower.y);
    ctx.lineTo(tower.x + 14, tower.y);
    ctx.stroke();
  } else if (tower.type === 'overcharger') {
    ctx.beginPath();
    ctx.moveTo(tower.x, tower.y - 12);
    ctx.lineTo(tower.x + 7, tower.y);
    ctx.lineTo(tower.x, tower.y + 12);
    ctx.lineTo(tower.x - 7, tower.y);
    ctx.closePath();
    ctx.stroke();
  } else if (tower.type === 'range_amp') {
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, 15, 0, Math.PI * 2);
    ctx.stroke();
  } else if (tower.type === 'reactor') {
    ctx.beginPath();
    ctx.moveTo(tower.x, tower.y - 12);
    ctx.lineTo(tower.x + 10, tower.y + 8);
    ctx.lineTo(tower.x - 10, tower.y + 8);
    ctx.closePath();
    ctx.stroke();
  } else if (tower.type === 'nexus') {
    ctx.beginPath();
    ctx.moveTo(tower.x, tower.y - 14);
    ctx.lineTo(tower.x + 12, tower.y);
    ctx.lineTo(tower.x, tower.y + 14);
    ctx.lineTo(tower.x - 12, tower.y);
    ctx.closePath();
    ctx.stroke();
  }
  ctx.restore();

  // Выбранная башня получает тонкий внешний контур, как активная карточка.
  if (selected) {
    ctx.shadowBlur = 18;
    ctx.shadowColor = type.color;
    ctx.globalAlpha = 0.75;
    ctx.strokeStyle = type.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(tower.x, tower.y, 26, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}
'''

          game = game[:start] + new_draw + game[end:]
          game_path.write_text(game, encoding='utf-8')

          stray = Path('version-78-trigger-2.txt')
          if stray.exists():
              stray.unlink()
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css game-core.js version-78-trigger-2.txt
          git commit -m "Версия 79"
          git push
