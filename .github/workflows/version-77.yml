name: Version 77
on:
  push:
    branches:
      - version-77-work
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="wave-status"><span id="wave">0 ∞</span><small>волна</small><span id="kills">0</span><small>сбито</small></div>'
          new = '<div class="wave-status"><small>WAVE</small><span id="wave">0 ∞</span><small>KILLS</small><span id="kills">0</span></div>'
          if old not in s:
              raise SystemExit('status markup not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          old = '''.wave-status span {
  grid-column: 1;
}
.wave-status small {
  grid-column: 2;
  align-self: center;
  white-space: nowrap;
}'''
          new = '''.wave-status small {
  grid-column: 1;
  align-self: center;
  white-space: nowrap;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.78;
}
.wave-status span {
  grid-column: 2;
  justify-self: end;
}'''
          if old not in s:
              raise SystemExit('version 76 layout css not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/version-77.yml version-77-trigger.txt version-77-trigger-2.txt
          git add index.html styles.css .github/workflows/version-77.yml version-77-trigger.txt version-77-trigger-2.txt
          git commit -m 'Версия 77'
          git push origin HEAD:version-77-work
