name: Version 78
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="wave-status"><small>WAVE</small><span id="wave">0 ∞</span><small>KILLS</small><span id="kills">0</span></div>'
          new = '<div class="wave-status"><div class="wave-stat"><small>WAVE</small><span id="wave">0 ∞</span></div><div class="wave-stat"><small>KILLS</small><span id="kills">0</span></div></div>'
          if old not in s: raise SystemExit('wave markup not found')
          s = s.replace(old, new, 1)
          icons = {
            'pulse': '<svg class="tower-icon pulse" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="8" /><path class="icon-stroke" d="M20 7v8M20 25v8M7 20h8M25 20h8" /><circle class="icon-fill" cx="20" cy="20" r="3" /></svg>',
            'rail': '<svg class="tower-icon rail" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="8" /><path class="icon-stroke" d="M8 29 29 8M13 32 32 13M10 20h10M20 10v10" /><circle class="icon-fill" cx="29" cy="8" r="3" /></svg>',
            'frost': '<svg class="tower-icon frost" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="7" /><path class="icon-stroke" d="M20 5v30M5 20h30M9 9l22 22M31 9 9 31" /><circle class="icon-fill" cx="20" cy="20" r="3" /></svg>',
            'blast': '<svg class="tower-icon blast" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="7" /><path class="icon-stroke" d="M20 5v7M20 28v7M5 20h7M28 20h7M9 9l5 5M26 26l5 5M31 9l-5 5M14 26l-5 5" /><circle class="icon-fill" cx="20" cy="20" r="4" /></svg>',
            'arc': '<svg class="tower-icon arc" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="7" /><path class="icon-stroke" d="M7 27c5-7 9-7 13 0 4 7 8 7 13 0M11 13c4-5 8-5 12 0 3 4 5 4 7 1" /><circle class="icon-fill" cx="20" cy="20" r="3" /></svg>',
            'titan': '<svg class="tower-icon titan" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="8" /><path class="icon-stroke" d="M7 12h10M23 12h10M7 28h10M23 28h10M10 8v7M30 8v7M10 25v7M30 25v7" /><circle class="icon-fill" cx="20" cy="20" r="4" /></svg>',
            'nova': '<svg class="tower-icon nova" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="8" /><path class="icon-stroke" d="M20 4v8M20 28v8M4 20h8M28 20h8M9 9l6 6M25 25l6 6M31 9l-6 6M15 25l-6 6" /><circle class="icon-fill" cx="20" cy="20" r="5" /></svg>',
            'devastator': '<svg class="tower-icon devastator" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="9" /><path class="icon-stroke" d="M20 4v9M20 27v9M4 20h9M27 20h9M8 8l7 7M25 25l7 7M32 8l-7 7M15 25l-7 7" /><circle class="icon-fill" cx="20" cy="20" r="4" /></svg>',
            'singularity': '<svg class="tower-icon singularity" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="10" /><circle class="icon-stroke" cx="20" cy="20" r="6" /><circle class="icon-fill" cx="20" cy="20" r="2.8" /></svg>',
            'booster': '<svg class="tower-icon booster" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="8" /><path class="icon-stroke" d="M20 4v7M20 29v7M4 20h7M29 20h7M9 9l5 5M26 26l5 5M31 9l-5 5M14 26l-5 5" /><circle class="icon-fill" cx="20" cy="20" r="3" /></svg>',
            'overcharger': '<svg class="tower-icon booster" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="8" /><path class="icon-stroke" d="M20 5v30M5 20h30" /><path class="icon-stroke" d="m13 13 5 5-5 5M27 13l-5 5 5 5" /><circle class="icon-fill" cx="20" cy="20" r="3.5" /></svg>',
            'range_amp': '<svg class="tower-icon booster" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="12" /><circle class="icon-stroke" cx="20" cy="20" r="7" /><circle class="icon-fill" cx="20" cy="20" r="3" /></svg>',
            'reactor': '<svg class="tower-icon booster" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="8" /><path class="icon-stroke" d="M20 4v10M20 26v10M4 20h10M26 20h10" /><path class="icon-stroke" d="m12 12 5 5M23 23l5 5M28 12l-5 5M17 23l-5 5" /><circle class="icon-fill" cx="20" cy="20" r="4" /></svg>',
            'nexus': '<svg class="tower-icon booster" viewBox="0 0 40 40" aria-hidden="true"><circle class="icon-bg" cx="20" cy="20" r="15" /><circle class="icon-stroke" cx="20" cy="20" r="10" /><path class="icon-stroke" d="M20 4v32M4 20h32M9 9l22 22M31 9 9 31" /><circle class="icon-fill" cx="20" cy="20" r="3" /></svg>'
          }
          for key, icon in icons.items():
              m = re.search(rf'(<button[^>]*data-tower="{re.escape(key)}"[^>]*>).*?(<span class="tower-copy">)', s, re.S)
              if not m: raise SystemExit(f'block not found: {key}')
              block = m.group(0)
              block2, count = re.subn(r'<svg class="tower-icon\b.*?</svg>', icon, block, count=1, flags=re.S)
              if not count: raise SystemExit(f'icon not found: {key}')
              s = s[:m.start()] + block2 + s[m.end():]
          p.write_text(s, encoding='utf-8')

          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          start = s.find('.wave-status span {')
          if start == -1: raise SystemExit('wave css not found')
          end = s.find('@media (max-width: 520px)', start)
          if end == -1: raise SystemExit('wave media marker not found')
          replacement = '''.wave-status {\n  display: flex !important;\n  flex-direction: column;\n  justify-content: center;\n  gap: 4px;\n  min-width: 92px;\n}\n.wave-stat {\n  display: grid;\n  grid-template-columns: 1fr auto;\n  align-items: baseline;\n  column-gap: 10px;\n  line-height: 1;\n}\n.wave-stat small {\n  font-size: 0.68rem;\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  opacity: 0.72;\n  white-space: nowrap;\n}\n.wave-stat span {\n  font-variant-numeric: tabular-nums;\n  font-size: 1rem;\n  font-weight: 800;\n  justify-self: end;\n  white-space: nowrap;\n}\n.wave-stat #kills { color: #ff8ca0; }\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/version-78.yml
          git add index.html styles.css .github/workflows/version-78.yml
          git commit -m 'Версия 78'
          git push origin HEAD:main
