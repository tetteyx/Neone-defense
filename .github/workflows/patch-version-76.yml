name: patch-version-76
on:
  push:
    branches:
      - version-76-work
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '''        <div class="status-strip" aria-label="Статистика">\n          <div class="cash-status"><span id="money">$170</span><small>CASH</small></div>\n          <div class="lives-status" aria-label="Жизни"><div id="lives" class="heart-lives" aria-live="polite"></div><small>ЖИЗНИ</small></div>\n          <div><span id="wave">0 ∞</span><small>волна</small></div>\n          <div><span id="kills">0</span><small>сбито</small></div>\n        </div>'''
          new = '''        <div class="status-strip" aria-label="Статистика">\n          <div class="cash-status"><span id="money">$170</span><small>CASH</small></div>\n          <div class="lives-status" aria-label="Жизни"><div id="lives" class="heart-lives" aria-live="polite"></div><small>ЖИЗНИ</small></div>\n          <div class="wave-status"><span id="wave">0 ∞</span><small>волна</small><span id="kills">0</span><small>сбито</small></div>\n        </div>'''
          if old not in text:
              raise SystemExit('status block not found')
          index.write_text(text.replace(old, new, 1), encoding='utf-8')

          styles = Path('styles.css')
          css = styles.read_text(encoding='utf-8')
          addition = '''\n\n/* Версия 76 — счётчик сбитых целей находится в колонке волны. */\n.wave-status {\n  display: grid !important;\n  grid-template-columns: auto auto;\n  grid-template-rows: auto auto;\n  align-content: center;\n  column-gap: 8px;\n  row-gap: 2px;\n}\n.wave-status span {\n  grid-column: 1;\n}\n.wave-status small {\n  grid-column: 2;\n  align-self: center;\n  white-space: nowrap;\n}\n.wave-status span#kills {\n  grid-column: 1;\n  color: #ff8ca0;\n}\n@media (max-width: 520px) {\n  .wave-status {\n    grid-template-columns: auto auto;\n  }\n}\n'''
          if '/* Версия 76 — счётчик сбитых целей находится в колонке волны. */' not in css:
              styles.write_text(css + addition, encoding='utf-8')

          wf = Path('.github/workflows/patch-version-76.yml')
          if wf.exists():
              wf.unlink()

          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css .github/workflows/patch-version-76.yml
          git commit -m "Version 76 final"
          git push
